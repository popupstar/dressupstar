<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POP UP STAR!</title>
  
  <!-- Import Font Modern dari Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  
  <!-- File CSS Terpisah -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Library Screenshot -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <div class="bg-pattern"></div>

  <!-- PAGE 1: LANDING PAGE -->
  <div id="landing-page">
    <div class="logo-container">
      <img id="main-logo-img" src="pop_up_star_logo.png" alt="POP UP STAR! Logo" onerror="this.src='https://via.placeholder.com/350x200/fe3781/ffffff?text=POP+UP+STAR!'">
    </div>

    <div class="btn-group-landing">
      <button class="glossy-btn" onclick="startGame()">START</button>
      <button class="glossy-btn invitation" onclick="openInvitation()">INVITATION LETTER</button>
    </div>
  </div>

  <!-- PAGE 2: DRESS UP ROOM -->
  <div id="game-page">
    <div class="game-header">
      <img src="pop_up_star_logo.png" class="small-logo" alt="Logo" onerror="this.src='https://via.placeholder.com/120x40/fe3781/ffffff?text=POP+UP+STAR!'">
      <div class="header-actions">
        <button class="white-pink-btn" onclick="resetOutfit()">RESET</button>
        <button class="white-pink-btn" onclick="downloadAvatar()">SAVE 📸</button>
      </div>
    </div>

    <!-- BOX UTAMA DRESS-UP -->
    <div class="main-dressup-box">
      
      <!-- BOX 1 (ATAS): KARAKTER AVATAR -->
      <div class="box-top-character">
        <div class="avatar-stage" id="avatar-stage">
          <div class="stage-bg" id="stage-bg"></div>
          <img id="base-char-img" class="base-character" src="Tak_berjudul306.png" alt="Base Character" onerror="this.src='https://via.placeholder.com/200x400/ff77ad/ffffff?text=Base+Character'">
        </div>
      </div>

      <!-- BOX 2 (BAWAH): ITEMS & OUTFIT (DENGAN PINK GLOW SHADOW) -->
      <div class="box-bottom-items">
        <div class="category-tabs" id="category-tabs"></div>
        <div class="items-grid" id="items-grid"></div>
      </div>

    </div>
  </div>

  <!-- MODAL INVITATION BERISI GAMBAR POSTER -->
<!-- MODAL INVITATION DENGAN FITUR UPLOAD FOTO SENDIRI -->
<div class="modal-overlay" id="invitation-modal">
  <div class="modal-card invitation-card">
    <button class="close-modal-btn" onclick="closeInvitation()">&times;</button>
    <h2 style="color: var(--hot-pink); margin-bottom: 10px;">💌 Party Invitation! 💌</h2>
    
    <!-- Area Poster Undangan & Foto Pengguna -->
    <div class="invitation-preview-container" id="invitation-preview-area">
      <!-- Background / Poster Dasar Undangan -->
      <img src="assets/invitation_poster.png" class="base-poster-img" alt="Poster" onerror="this.src='https://via.placeholder.com/400x550/fe3781/ffffff?text=Invitation+Poster'">
      
      <!-- Slot Foto yang di-upload pemain akan muncul di sini secara interaktif -->
      <div class="user-uploaded-photo-slot" id="user-photo-wrapper">
        <img id="preview-user-photo" src="" alt="" style="display: none;">
        <div id="upload-placeholder-text" style="font-size: 0.8rem; color: #888; text-align: center; padding: 10px;">
          📸 Upload fotomu di sini!
        </div>
      </div>
    </div>

    <!-- Tombol Upload Foto Sendiri -->
    <div style="margin-top: 15px; display: flex; gap: 10px; flex-direction: column;">
      <label class="white-pink-btn" style="cursor: pointer; width: 100%; text-align: center;">
        UPLOAD WRECKER'S PHOTO
        <input type="file" id="upload-invitation-photo" accept="image/*" style="display: none;" onchange="handleInvitationPhotoUpload(event)">
      </label>
      
      <button class="glossy-btn" style="width: 100%; padding: 10px; font-size: 1rem;" onclick="closeInvitation(); startGame();">START DRESS UP!</button>
    </div>
  </div>
</div>
    <!-- Menampilkan Gambar Poster Undangan Buatanmu -->
    <div class="invitation-img-container">
      <img src="assets/invitation_poster.png" alt="Party Invitation Poster" onerror="this.src='https://via.placeholder.com/400x550/fe3781/ffffff?text=Invitation+Poster'">
    </div>

    <button class="glossy-btn" style="margin-top: 15px; width: 100%; padding: 10px; font-size: 1rem;" onclick="closeInvitation(); startGame();">START DRESS UP!</button>
  </div>
</div>

  <!-- File JS Terpisah -->
  <script src="script.js"></script>
</body>
</html>
